[project]
name = "bachelor-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GraffiasAntares", email = "star211@list.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "pyarrow==15",
    "numpy<2.0.0",
    "mlflow>=3.16.0",
    "torch>=2.2.2",
    "pykan>=0.2.8",
    "matplotlib>=3.11.1",
    "pyyaml>=6.0.3",
    "tqdm>=4.70.0",
    "openmeteo-requests>=1.7.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
bachelor-project = "bachelor_project:main"
load-data = "bachelor_project.ingestion.ingestion:main"
test-load-data = "bachelor_project.ingestion.test:main"
[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

